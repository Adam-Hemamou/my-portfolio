<app-menu></app-menu>
<div *ngIf="project as project">
  <div class="project-hero">
    <div class="project-hero-content">
      <h1 class="project-title" [appTypewriter]="project.title"></h1>
      <p
        class="project-context"
        data-aos="fade-right"
        data-aos-delay="400"
        data-aos-duration="800"
      >
        {{ project.context }}
      </p>
      <div
        class="project-link-btns"
        *ngIf="project?.site || project?.github"
        data-aos="fade-right"
        data-aos-delay="500"
        data-aos-duration="800"
      >
        <a
          *ngIf="project.site; else githubBtn"
          class="project-btn-redirect"
          [href]="project.site"
          target="_blank"
          rel="noopener"
        >
          <span class="arrow">
            <img src="/svg/arrow.svg" alt="Icône flèche - Visiter le site" />
          </span>
          <span>Visiter le site</span>
        </a>
        <ng-template #githubBtn>
          <a
            *ngIf="project.github"
            class="project-btn-redirect"
            [href]="project.github"
            target="_blank"
            rel="noopener"
          >
            <span class="arrow">
              <img src="/svg/arrow.svg" alt="Icône flèche - Visiter le site" />
            </span>
            <span>Voir le projet</span>
          </a>
        </ng-template>
      </div>
    </div>
    <div
      class="project-hero-svg"
      data-aos="fade-up"
      data-aos-delay="650"
      data-aos-duration="800"
    >
      <app-neon-rectangles
        composition="wide"
        label="Élément décoratif géométrique"
      ></app-neon-rectangles>
    </div>
  </div>
  <app-animate-band></app-animate-band>
  <div class="project-main-layout">
    <h2 class="challenge-title">Challenge</h2>
    <ul class="challenge-list">
      <li *ngFor="let c of project.challenge">
        <img src="/svg/puce.svg" alt="puce liste" class="challenge-puce" />
        <span>{{ c }}</span>
      </li>
    </ul>
    <div
      class="project-rectangles"
      data-aos="fade-up"
      data-aos-delay="200"
      data-aos-duration="800"
    >
      <img
        [src]="project.image"
        [alt]="'Capture d\'écran du projet ' + project.title"
        width="1254"
        height="1254"
        class="project-photo"
        data-aos="fade-up"
        data-aos-delay="400"
        data-aos-duration="800"
      />
    </div>
    <div class="solution-section" *ngIf="project.solution">
      <h2 class="solution-title">Solution</h2>
      <p class="solution-content">
        {{ project.solution }}
      </p>
    </div>
  </div>
</div>
<div class="tools-section" *ngIf="project">
  <div class="tools-content">
    <h2 class="tools-title">Les outils utilisés</h2>
    <div class="tools-subtitle">Langages et logiciels</div>
  </div>
  <div class="tools-grid">
    <app-stacks-card
      *ngFor="let outil of tools"
      [stack]="outil"
      layout="split"
    ></app-stacks-card>
  </div>
</div>
<div class="img-section">
  <h2 class="img-section-title">Images du projet</h2>
  <swiper-container
    *ngIf="project"
    class="project-images-carousel"
    slides-per-view="1"
    slides-per-group="1"
    space-between="20"
    pagination="true"
  >
    <swiper-slide *ngFor="let img of project.images">
      <div class="img-container">
        <img
          [src]="img"
          [alt]="'Image du projet ' + project.title"
          style="width: 100%"
          loading="lazy"
          decoding="async"
        />
      </div>
    </swiper-slide>
  </swiper-container>

  <div class="project-images-flex" *ngIf="project">
    <div class="row">
      <img
        class="img-landscape"
        [src]="project.images[0]"
        [alt]="'Image du projet ' + project.title"
        loading="lazy"
        decoding="async"
      />
      <img
        class="img-square"
        [src]="project.images[1]"
        [alt]="'Image du projet ' + project.title"
        loading="lazy"
        decoding="async"
      />
    </div>
    <div class="row">
      <img
        class="img-square"
        [src]="project.images[2]"
        [alt]="'Image du projet ' + project.title"
        loading="lazy"
        decoding="async"
      />
      <img
        class="img-landscape"
        [src]="project.images[3]"
        [alt]="'Image du projet ' + project.title"
        loading="lazy"
        decoding="async"
      />
    </div>
  </div>
</div>

<app-footer></app-footer>
